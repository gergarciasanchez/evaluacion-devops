
name: CI-CD DevSU Django Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Build and Quality
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: "ci-test-only-secret-key-not-for-production"
      DATABASE_NAME: "db.sqlite3"
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Code Build - Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Code Build - Django validation
        run: |
          python manage.py check

      - name: Unit Tests
        run: |
          python manage.py test

      - name: Static Code Analysis
        continue-on-error: true
        run: |
          flake8 api demo manage.py

      - name: Code Coverage
        run: |
          coverage run manage.py test
          coverage report --fail-under=90

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/evaluacion-devops:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/evaluacion-devops:${{ github.sha }}

  deploy:
    name: Kubernetes Deploy
    runs-on: [self-hosted, linux, x64, minikube]
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify Kubernetes connection
        run: |
          kubectl config current-context
          kubectl get deployments

      - name: Deploy ConfigMap
        run: |
          kubectl apply -f kubernetes/configmap.yaml

      - name: Deploy Django application
        run: |
          sed "s|image: gergarciasanchez/evaluacion-devops:latest|image: gergarciasanchez/evaluacion-devops:${GITHUB_SHA}|" \
            kubernetes/deployment.yaml | kubectl apply -f -

      - name: Deploy Kubernetes Service
        run: |
          kubectl apply -f kubernetes/service.yaml

      - name: Deploy Ingress
        run: |
          kubectl apply -f kubernetes/ingress.yaml

      - name: Deploy Horizontal Pod Autoscaler
        run: |
          kubectl apply -f kubernetes/hpa.yaml

      - name: Validate deployment
        run: |
          kubectl rollout status deployment/django-app --timeout=180s
          kubectl get deployments
          kubectl get pods
          kubectl get hpa

